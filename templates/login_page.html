{% extends "base.html" %}

{% block title %}AyurSutra | Secure Login{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 4rem auto;" class="animate-fade-in">
  <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-xl);">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
        <i data-lucide="leaf" style="color: var(--primary);"></i>
        <span>AyurSutra</span>
      </div>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Access your wellness journey.</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div style="position: relative;">
          <i data-lucide="user" style="position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 16px;"></i>
          <input type="text" id="username" name="username" class="form-control" placeholder="john.doe" style="padding-left: 2.5rem;" required>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <i data-lucide="lock" style="position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 16px;"></i>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" style="padding-left: 2.5rem;" required>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
        <input type="checkbox" id="remember" name="remember" style="width: 1rem; height: 1rem; cursor: pointer; border-radius: 4px; accent-color: var(--primary);">
        <label for="remember" style="font-size: 0.875rem; color: var(--text-muted); cursor: pointer; user-select: none;">Keep me logged in</label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.875rem; font-size: 1rem;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-light);">
      <p style="color: var(--text-muted); font-size: 0.875rem;">Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); font-weight: 600;">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
